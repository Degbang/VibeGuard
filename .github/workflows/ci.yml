name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: black --check
        run: black --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy .

      - name: pytest
        run: pytest -q

      - name: coverage (report only, not a merge gate)
        run: pytest -q --cov=vibeguard --cov=evaluation --cov=main --cov=process_supervisor --cov-report=term-missing
